name: Build Maltrail blocklist

# Membangun ulang maltrail.txt (blocklist domain malware & phishing untuk
# AdGuard Home) dari feed Maltrail secara berkala. Trails Maltrail selalu
# diperbarui, jadi rebuild ini menjaga blocklist tetap segar tanpa campur
# tangan manual. AdGuard Home cukup auto-refresh dari raw URL maltrail.txt.

on:
  schedule:
    - cron: "0 3 * * 1"   # setiap Senin 03:00 UTC
  workflow_dispatch: {}    # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: maltrail-blocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4

      - name: Checkout Maltrail (sumber feed)
        uses: actions/checkout@v4
        with:
          repository: stamparm/maltrail
          path: .maltrail
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build maltrail.txt
        run: |
          python3 scripts/build_maltrail_blocklist.py \
            --maltrail .maltrail \
            --output maltrail.txt

      - name: Commit bila ada perubahan
        run: |
          rm -rf .maltrail
          if git diff --quiet -- maltrail.txt; then
            echo "Tidak ada perubahan pada maltrail.txt — lewati commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maltrail.txt
          git commit -m "chore(maltrail): perbarui blocklist ($(date -u +%F))"
          git push
